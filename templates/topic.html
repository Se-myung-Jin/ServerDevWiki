<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 제목은 catalog.js 의 title 로 자동 설정된다. -->
  <title>ServerDevWiki</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/boot.js"></script>
</head>
<!--
  주제 문서 템플릿
  1. 이 파일을 <분야 폴더>/<slug>.html 로 복사한다. 예: operating-system/process-thread.html
  2. 아래 data-topic 을 "<분야 폴더>/<slug>" 로 바꾼다.
  3. assets/catalog.js 의 해당 분야 topics 에 { slug, title, importance, summary, tags } 를 추가한다.

  제목 · 단계 배지 · 요약 · 목차 · 점검 문항 · 이전/다음 링크는 자동으로 붙는다.
  여기에는 본문만 쓴다. 면접·필기 문항은 assets/quiz-data.js 에 쓰면 문서 끝에 "점검 문항"으로 붙는다.

  쓸 수 있는 것
  - <span class="blank">핵심어</span> : 학습 모드에서 가려지고 클릭하면 보인다.
  - <pre><code class="language-csharp">...</code></pre> : 코드 하이라이트 (cpp, csharp, sql, bash ...)
  - <div class="table-scroll"><table>...</table></div> : 가로로 긴 표
  - <blockquote> : 주의점, 인용
-->
<body data-page="topic" data-topic="00-category/slug">
  <article class="doc-body">

    <h2>핵심 요약</h2>
    <p><!-- 한두 문단으로 이 개념이 무엇이고 왜 중요한지. 종류가 나뉘면 표로 --></p>

    <h2>동작 원리</h2>
    <!-- h3 소제목으로 나눠도 된다(목차에 함께 나온다). 그림은 아래처럼:
    <figure class="fig">
      <svg viewBox="0 0 720 150">...  f-cell / f-hit / f-miss / f-text / f-sub / f-line 클래스로 색 지정</svg>
      <figcaption>그림 설명</figcaption>
    </figure>
    -->
    <p></p>

    <!-- 토픽에 맞게 필요한 섹션을 넣는다. 예: 선택 기준, 비교, 구현 방식 -->

    <h2>게임 서버에서는</h2>
    <p><!-- 실제로 이어지는 버그 · 설계 결정 · 성능 문제 --></p>

    <h2>주의 사항</h2>
    <ul>
      <li></li>
    </ul>

  </article>

  <script src="../assets/catalog.js"></script>
  <script src="../assets/quiz-data.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
